{% extends "base.html" %}
{% block title %}Чат — aichat{% endblock %}
{% block body_class %}page-chat{% endblock %}
{% block main_class %}chat-main{% endblock %}
{% block content %}
<section class="chat-shell">
  <aside class="chat-side">
    <label class="model-label">Модель
      <select id="model-select" data-default="{{ default_model }}">
        <option value="{{ default_model }}" selected>{{ default_model }}</option>
      </select>
    </label>
    <button type="button" class="btn btn-ghost" id="clear-chat">Очистить</button>
    <a class="side-link" href="/tokens">API-токены →</a>
  </aside>
  <div class="chat-panel">
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="2" placeholder="Напишите сообщение…" required></textarea>
      <button class="btn" type="submit" id="send-btn">Отправить</button>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/chat.js"></script>
{% endblock %}
