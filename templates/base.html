<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}aichat{% endblock %}</title>
  <meta name="description" content="{{ og_description }}">
  {% if robots %}<meta name="robots" content="{{ robots }}">{% endif %}
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:site_name" content="{{ og_site_name }}">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ og_description }}">
  <meta property="og:url" content="{{ og_url }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:image:width" content="{{ og_image_width }}">
  <meta property="og:image:height" content="{{ og_image_height }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.title() }}">
  <meta name="twitter:description" content="{{ og_description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span class="muted">aichat</span>
    <nav class="footer-nav">
      <a href="/catalog">Каталог навыков</a>
      <a href="/about">О сервисе</a>
      <a href="/privacy">Политика конфиденциальности</a>
      <a href="/terms">Пользовательское соглашение</a>
    </nav>
    <p class="footer-disclaimer">Чатбот может ошибаться и галлюцинировать — проверяйте ответы на реальность.</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
