<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Здесь скоро вырастет сайт</title>
</head>
<body class="placeholder-page">
    <div class="m-container">
        <div class="placeholder-page-wrapper">
                <a href="https://hoster.by/" class="head-icon">
                    <img src="https://hoster.by/local/img/isp-placeholder/hoster-logo.svg" alt="hoster.by logo">
                </a>
                <div class="placeholder-main-content">
                    <img class="placeholder-main-icon" src="https://hoster.by/local/img/isp-placeholder/placeholder-image.png" class="main-icon" alt="grow icon">
                    <h1 class="m-font-hl2 placeholder-title">Здесь скоро вырастет сайт</h1>
                    <p class="m-font-b1 placeholder-text">Если вы тоже хотите свой онлайн-проект, выберите для него имя</p>
                    <a href="https://hoster.by/service/domains/" class="m-button red placeholder-link m-font-btn-norm">Подобрать доменное имя</a>
                </div>
        </div>
    </div>
    <style>
        /* fonts */
        @font-face {
            font-family: 'Montserrat';
            src: local('Montserrat-Regular'),
            url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Regular.woff2') format('woff2'),
            url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Regular.woff') format('woff'),
            url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Regular.eot?#iefix') format('embedded-opentype'),
            url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Regular.otf') format('opentype'),
            url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Montserrat';
            src: local('Montserrat-Medium'),
                url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Medium.woff2') format('woff2'),
                url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Medium.woff') format('woff'),
                url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Medium.eot?#iefix') format('embedded-opentype'),
                url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Medium.otf') format('opentype'),
                url('https://hoster.by/local/templates/2024/fonts/montserrat/Montserrat-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Nagel VF';
            src: url('https://hoster.by/local/templates/2024/fonts/nagel/nagel_vf.woff2') format('woff2'),
                url('https://hoster.by/local/templates/2024/fonts/nagel/nagel_vf.woff') format('woff'),
                url('https://hoster.by/local/templates/2024/fonts/nagel/nagel_vf.ttf') format('truetype');
                font-display: swap;
        }
        /* reset styles */
        header,
        footer,
        main,
        section {
            display: block;
        }

        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        *:before,
        *:after {
            display: block;
            position: absolute;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        ul,
        ol {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        body,
        h1,
        h2,
        h3,
        h4,
        p,
        ul[class],
        ol[class],
        li,
        figure,
        figcaption,
        blockquote,
        dl,
        dd {
            margin: 0;
        }

        html {
            line-height: 1;
            -webkit-text-size-adjust: 100%;
        }

        body {
            line-height: 1;
            min-width: 320px;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
        }

        a {
            cursor: pointer;
            outline: 0;
            text-decoration: none;
        }

        button {
            cursor: pointer;
            padding: 0;
            outline: 0;
            border: 0;
            background-color: rgba(255, 255, 255, 0);
        }

        input:focus,
        textarea:focus {
            outline-offset: 0;
            outline: none;
        }

        input::-ms-clear {
            display: none;
            width: 0;
            height: 0;
        }

        input::-ms-reveal {
            display: none;
            width: 0;
            height: 0;
        }

        input::-webkit-search-decoration,
        input::-webkit-search-cancel-button,
        input::-webkit-search-results-button,
        input::-webkit-search-results-decoration {
            display: none;
        }

        /* main styles */

        .m-container {
            margin: 0 auto;
            max-width: 100%;
            padding: 0 16px;
        }

        img {
            -webkit-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            -ms-user-drag: none;
            user-drag: none;
        }

        .m-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nagel VF', 'Roboto', sans-serif;
            font-weight: normal;
            padding: 12px 24px;
            text-align: center;
            font-weight: 500;
            font-size: inherit;
            border-width: 1px;
            border-radius: 4px;
            min-height: 48px;
            cursor: pointer;
            -webkit-transition: all .3s;
            -o-transition: all .3s;
            transition: all .3s;
        }

        .m-button.big {
            padding: 14px 24px;
            min-height: 60px;
        }

        .m-button.med {
            padding: 8px 24px;
            min-height: 40px;
        }

        .m-button.disabled,
        .m-button.disabled:hover,
        .m-button[disabled] {
            cursor: default !important;
            background: rgba(0, 5, 62, 0.08) !important;
            color: #9496AE !important;
            border-color: rgba(0, 5, 62, 0.08) !important;
        }

        .m-button.disabled,
        .m-button.disabled:hover,
        .m-button[disabled] {
            cursor: default !important;
            background: rgba(0, 5, 62, 0.08) !important;
            color: #9496AE !important;
            border-color: rgba(0, 5, 62, 0.08) !important;
        }

        .m-button.red {
            background-color: #E91641;
            color: #FFFFFF;
        }

        .m-button.red:hover {
            background-color: #DA113A;
        }

        .m-button.red:active {
            background-color: #B41334;
        }

        .m-font-hl2 {
            font-family: 'Nagel VF', 'Roboto', sans-serif;
            font-size: 50px;
            line-height: 58px;
            font-weight: 400;
        }

        .m-font-b1 {
            font-family: 'Montserrat', 'Roboto', Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 24px;
            font-weight: 500;
        }

        .m-font-btn-norm {
            font-family: 'Nagel VF', 'Roboto', sans-serif;
            font-size: 18px;
            font-weight: 500;
            line-height: 13px;
        }

        .placeholder-page {
            background: linear-gradient(84deg, #EBF4FD -1.45%, #F5F9FE 98.81%);
        }

        .placeholder-page-wrapper {
            margin: 60px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .placeholder-main-icon {
            margin-top: 120px;
        }

        .placeholder-main-icon img {
            display: block;
        }

        .head-icon img {
            display: block
        }

        .placeholder-main-content {
            max-width: 662px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .placeholder-link {
            margin-top: 40px;
        }

        .placeholder-title {
            margin-top: 60px;
            color: #003;
            text-align: center;
        }

        .placeholder-text {
            margin-top: 16px;
            color: #212121;
            text-align: center;
        }

        .placeholder-link {
            margin-top: 40px;
        }

        @media (max-width: 1600px) and (min-width: 1240px) {
            .m-font-hl2 {
                font-size: 42px;
                line-height: 48px;
                font-weight: 400;
            }

            .m-font-b1 {
                font-size: 15px;
                line-height: 22px;
            }
        }

        @media (max-width: 1239px) and (min-width: 768px) {

            .m-font-hl2 {
                font-size: 32px;
                line-height: 38px;
                font-weight: 400;
            }

            .m-font-b1 {
                font-size: 15px;
                line-height: 22px;
            }
        }

        @media (max-width: 1239px) {
            .placeholder-page-wrapper {
                margin: 40px 0;
            }

            .placeholder-main-icon {
                margin-top: 88px;
            }

            .placeholder-title {
                margin-top: 40px;
            }
            .placeholder-link {
                margin-top: 32px;
            }

            .placeholder-main-icon {
                max-width: 200px;
                max-height: 200px;
            }
        }

        @media (max-width: 767px) {
            .m-container {
                width: 100%;
                max-width: 100%;
                padding: 0 32px;
            }

            .m-font-hl2 {
                font-size: 30px;
                line-height: 34px;
                font-weight: 400;
            }

            .m-font-b1 {
                font-size: 14px;
                line-height: 20px;
            }

            .m-font-btn-norm {
                font-size: 16px;
                line-height: 11px;
            }

            .placeholder-page-wrapper {
                margin: 60px 0 176px 0;
            }

            .placeholder-main-icon {
                margin-top: 80px;
            }
        }
    </style>
</body>
</html>
